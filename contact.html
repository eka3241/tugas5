<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Contact</title>
</head>
<body style="font-family:'Times New Roman', Times, serif; padding:20px 40px; margin:0;">

<h2>Form Contact</h2>

<form action="#" method="post" style="margin:0;">
  <fieldset>
    <legend>Contact</legend>

    <label>Nama:
      <input type="text" name="nama" placeholder="Masukkan nama">
    </label>
    <br><br>

    <label>Email:
      <input type="email" name="email" placeholder="Masukkan email">
    </label>
    <br><br>

    <label>Subject:
      <input type="text" name="subject" placeholder="Masukkan subject">
    </label>
    <br><br>

    <label>Pesan:</label>
    <br>
    <textarea name="pesan" rows="4" cols="35" placeholder="Tulis pesan Anda..."></textarea>
    <br><br>

    <input type="submit" value="Send">
    <input type="reset" value="Reset">

  </fieldset>
</form>

</body>
</html>
