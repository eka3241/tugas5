<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form URL</title>
</head>
<body>

<h2>Form URL</h2>

<form action="#" method="post">
  <fieldset>
    <legend>URL</legend>

    <label>URL:
      <input type="url" name="url" placeholder="Masukkan URL...">
    </label>
    <br><br>

    <label>Tanggal:
      <input type="date" name="tanggal">
    </label>
    <br><br>

    <label>Waktu:
      <input type="time" name="waktu">
    </label>
    <br><br>

    <label>Jumlah:
      <input type="number" name="jumlah">
    </label>
    <br><br>

    <input type="submit" value="Send">
    <input type="reset" value="Reset">

  </fieldset>
</form>

</body>
</html>
